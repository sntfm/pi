services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    env_file: .env
    network_mode: host
    command: postgres -c listen_addresses=127.0.0.1
    restart: always
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.13.3
    env_file: .env
    network_mode: host
    environment:
      - MEILI_HTTP_ADDR=127.0.0.1:7700
    restart: always
    volumes:
      - ./meili_data:/meili_data:Z

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    env_file: .env
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/postgres
      - MEILI_HOST=http://127.0.0.1:7700
    restart: always
    volumes:
      - ./data:/data/data:Z
    depends_on:
      - postgres
      - meilisearch
